<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdmIn UI</title>
    <base href="/" />
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link href="app.css" rel="stylesheet" />
    <link href="css/login-page.css" rel="stylesheet" />
    <script>
      // Pre-declare safeSignalr stub so Blazor can call it during early renders without error.
      window.safeSignalr = window.safeSignalr || {
        registerClickAwayIfExists: function () { },
        unregisterClickAwayIfExists: function () { },
        startIfExists: function () { return Promise.resolve(); },
        onNewNotificationIfExists: function () { }
      };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.6/signalr.min.js"></script>
    <script src="js/signalr-notifications.js"></script>
    <script>
        window.blazorDownloadFile = (filename, contentType, base64Data) => {
            const link = document.createElement('a');
            link.href = `data:${contentType};base64,${base64Data}`;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>
  </head>
  <body>
    <app>Loading...</app>
    <script src="_framework/blazor.server.js"></script>
  </body>
</html>
